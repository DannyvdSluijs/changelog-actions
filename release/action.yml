name: 'Changelog: release'
description: 'Turns the Unreleased section of a Keep a Changelog CHANGELOG.md into a dated release, then tags it and creates a GitHub release.'
author: 'Danny van der Sluijs'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  version:
    description: 'Version to release, as a bare semantic version, e.g. "7.0.0" or "7.0.0-rc1".'
    required: true
  token:
    description: 'Token used to commit, tag and release. Use a token that may bypass branch protection if the branch is protected.'
    default: ${{ github.token }}
  changelog-path:
    description: 'Path to the changelog file.'
    default: 'CHANGELOG.md'
  commit-message:
    description: 'Commit message. Placeholder: {version}.'
    default: 'docs: Prepare release {version}'
  committer-name:
    description: 'Name of the committer and tagger.'
    default: 'github-actions[bot]'
  committer-email:
    description: 'Email of the committer and tagger.'
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  tag:
    description: 'Create an annotated tag for the release.'
    default: 'true'
  github-release:
    description: 'Create a GitHub release with the changelog section as release notes.'
    default: 'true'
  add-v-prefix:
    description: 'Prefix the tag and release name with "v", e.g. v7.0.0. The version input and the changelog heading stay the bare version.'
    default: 'false'

outputs:
  version:
    description: 'The released version.'
  tag:
    description: 'The tag and release name: the version, prefixed with "v" when add-v-prefix is true.'
  notes:
    description: 'The release notes, i.e. the new changelog section without its heading. Contains PR titles, which are untrusted: never put it in a run script through an expression; pass it through env or use notes-file.'
  notes-file:
    description: 'Path to a file containing the release notes.'
  commit-sha:
    description: 'The sha of the changelog commit.'
  release-url:
    description: 'The URL of the GitHub release, when one was created.'

runs:
  using: 'node24'
  main: 'dist/index.cjs'
